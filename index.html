@media(prefers-reduced-motion:reduce){.card,.btn,.miniIcon{transition:none!important;transform:none!important}}

  <script>
document.getElementById('y').textContent=new Date().getFullYear();
(()=>{
const card=document.querySelector('.card');if(!card||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
let x=0,y=0,tx=0,ty=0,raf=0,baseline=null;
function animate(){x+=(tx-x)*.08;y+=(ty-y)*.08;card.style.setProperty('--rx',x.toFixed(2)+'deg');card.style.setProperty('--ry',y.toFixed(2)+'deg');card.style.setProperty('--shine',(50+y*6).toFixed(1)+'%');if(Math.abs(tx-x)>.01||Math.abs(ty-y)>.01)raf=requestAnimationFrame(animate);else raf=0;}
function onMove(e){if(e.beta==null||e.gamma==null)return;if(!baseline)baseline={beta:e.beta,gamma:e.gamma};tx=Math.max(-2,Math.min(2,(baseline.beta-e.beta)*.08));ty=Math.max(-2,Math.min(2,(e.gamma-baseline.gamma)*.08));if(!raf)raf=requestAnimationFrame(animate);}
function listen(){addEventListener('deviceorientation',onMove,{passive:true});}
if(typeof DeviceOrientationEvent==='undefined')return;
if(typeof DeviceOrientationEvent.requestPermission==='function'){
 const button=document.createElement('button');button.className='motionEnable';button.type='button';button.textContent='Ativar efeito 3D';document.querySelector('.foot').before(button);
 button.addEventListener('click',async()=>{try{if(await DeviceOrientationEvent.requestPermission()==='granted'){listen();button.remove();}else button.textContent='Movimento não autorizado';}catch(_){button.textContent='Sensor indisponível';}});
}else listen();
})();
</script>
